# ── Server ───────────────────────────────────────────────────────────────────
server.port=8085
server.servlet.context-path=/api

# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=knowbuddy-backend

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/knowbuddy
spring.datasource.username=knowbuddy
spring.datasource.password=admin123

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Flyway owns the schema — never let Hibernate alter it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.main.allow-bean-definition-overriding=true

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── File Upload Limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

## ── Jackson ───────────────────────────────────────────────────────────────────
#spring.jackson.default-property-inclusion=
#spring.jackson.serialization.write-dates-as-timestamps=false


spring.main.allow-bean-definition-overriding=true

# ── OpenAI (via LangChain4j) ──────────────────────────────────────────────────
langchain4j.open-ai.chat-model.api-key=
langchain4j.open-ai.chat-model.model-name=gpt-4o
langchain4j.open-ai.chat-model.temperature=0.2
langchain4j.open-ai.chat-model.max-tokens=2048
langchain4j.open-ai.chat-model.timeout=60s
langchain4j.open-ai.embedding-model.model-name=text-embedding-3-small
langchain4j.open-ai.embedding-model.timeout=30s

# ── AstraDB ───────────────────────────────────────────────────────────────────
astradb.token=
astradb.database-id=3ed15706-2d45-400c-ac97-b6172eef49fc
astradb.region=us-east-2
astradb.keyspace=knowbuddy
astradb.table=document_embeddings
# text-embedding-3-small produces 1536-dim vectors
astradb.embedding-dimension=1536

# Disable Spring's built-in Cassandra auto-configuration
# langchain4j-cassandra pulls in Cassandra drivers but we connect
# to AstraDB cloud via AstraDbEmbeddingStore — not local Cassandra
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.cassandra.CassandraHealthContributorAutoConfiguration
# ── Local File Storage ────────────────────────────────────────────────────────
# Relative to working dir by default; override with STORAGE_BASE_PATH env var
knowbuddy.storage.local.base-path=/app/uploads

# ── RAG Pipeline — OPTIMIZED ──────────────────────────────────────────────────
# Chunk size increased 400 → 1000: reduces chunk count ~3.75x for same document
# A 2MB PDF goes from ~1500 chunks to ~400 chunks
# Fewer chunks = fewer OpenAI embedding calls = dramatically faster ingestion
knowbuddy.rag.chunk-size=1000
knowbuddy.rag.chunk-overlap=150
knowbuddy.rag.max-results=5
knowbuddy.rag.min-score=0.70

# ── Intelligence (Summarization / Tagging / Flashcards) ───────────────────────
knowbuddy.intelligence.max-tags=8
knowbuddy.intelligence.summary-max-tokens=500
knowbuddy.intelligence.flashcard-count=10

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

